[package]
name = "smallvec-fuzzer"
authors = ["The Servo Project Developers"]
edition = "2024"
repository = "https://github.com/smallvec/smallvec-fuzzer"
license = "MIT"
homepage = "https://smallvec.rs"
description = "Fuzzer for SmallVec"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1.4", features = ["derive"] }
libfuzzer-sys = "0.4"
smallvec = { git = "https://github.com/smallvec/smallvec" }

[[bin]]
name = "main"
path = "fuzz_targets/main.rs"
test = false
doc = false
bench = false

[lints.rust]
unused = { level = "deny", priority = -1 }
deprecated = "deny"
unreachable_code = "deny"
nonstandard_style = { level = "deny", priority = -1 }
warnings = "deny"
missing_debug_implementations = "deny"
dropping_copy_types = "deny"
dropping_references = "deny"
elided_lifetimes_in_paths = "deny"
explicit_builtin_cfgs_in_flags = "deny"
forgetting_copy_types = "deny"
forgetting_references = "deny"
impl_trait_redundant_captures = "deny"
invalid_doc_attributes = "deny"
irrefutable_let_patterns = "deny"
macro_use_extern_crate = "deny"
missing_copy_implementations = "deny"
mutable_transmutes = "deny"
noop_method_call = "deny"
opaque_hidden_inferred_bound = "deny"
overflowing_literals = "deny"
redundant_imports = "deny"
single_use_lifetimes = "deny"
trivial_casts = "deny"
unknown_lints = "deny"
arithmetic_overflow = "deny"
missing_docs = "deny"
type_alias_bounds = "deny"

[lints.clippy]
all = "deny"

[lints.rustdoc]
all = "deny"

[lints.cargo]
unknown_lints = "deny"
unused_dependencies = "deny"
non_kebab_case_features = "deny"
